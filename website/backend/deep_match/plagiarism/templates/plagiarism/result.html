{% extends "plagiarism/result_template.html" %}

{% block content %}
    <div class="report-container">
        <h2 class="mb-4 text-center">Plagiarism Results</h2>

        <!-- Checked Date -->
        <p><strong>Checked Date:</strong> {{ checked_date }}</p>

        <!-- Plagiarism Percentage -->
        <p><strong>Plagiarism Detected:</strong> {{ plagiarism_percent }}%</p>

        <div class="pdf-frame">
            <!-- Use either iframe or embed -->
            <iframe src="data:application/pdf;base64,{{ base64_pdf }}" width="100%" height="800px"></iframe>
            <!-- OR -->
            <!-- <embed src="data:application/pdf;base64,{{ base64_pdf }}" type="application/pdf" width="100%" height="800px"> -->
        </div>

        <!-- Action Buttons -->
        <div class="mt-4 d-flex justify-content-between">
            <button class="btn btn-primary" onclick="downloadPDF()">Download Highlighted PDF</button>

            <a href="/welcome" class="btn btn-secondary">
                Back to Dashboard
            </a>
        </div>
    </div>
{% endblock %}
