<!DOCTYPE html>
<html lang="en">
<head>

            background-color: #f9f9f9;
            color: #333;
            text-align: center;
            padding-top: 100px;
        }
        .error-container {
            display: inline-block;
            padding: 30px;

<body>
    <div class="error-container">
        <h1>Error</h1>
        <p>{{ message }}</p>
        <a href="{% url 'welcome' %}">Return to Home</a>
