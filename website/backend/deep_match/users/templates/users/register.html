<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Load static files -->
    {% load static %}
    
    <!----======== CSS ======== -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}">


    <title>Seeker Registration</title> 
</head>
<body style="background-image: url('{% static 'images/background.jpg' %}');">
    <div class="container">
        <header>
            <h2>Register</h2>
        </header>
        <form action="" method="post">
            {% csrf_token %}
            <div class="form first">
                <div class="details personal">
                    <br>

                    <div class="fields">
                        <div class="input-field">
                            <label>Full Name</label>
                            <input type="text" placeholder="Enter your name" name = "name" required>
                        </div>
                    
                        <div class="input-field">
                            <label>Username</label>
                            <input type="text" placeholder="Enter username" name = "username" required>
                        </div>

                        <div class="input-field">
                            <label for="role">Role</label>
                            <select name="role" id="role" required>
                                <option value="" disabled selected>Select a role</option>
                                <option value="teacher">Teacher</option>
                                <option value="student">Student</option>
                            </select>
                        </div>

                        <div class="input-field">
                            <label>Email</label>
                            <input type="email" placeholder="Enter your email" name = "email" required>
                        </div>


                        <div class="input-field">
                            <label>Password</label>
                            <input type="password" placeholder="Enter password" name = "password" required>
                        </div>

                        <div class="input-field">
                            <label>Confirm Password</label>
                            <input type="password" placeholder="Retype Password" name = "retypepassword" required>
                        </div>
                    </div>
                </div>

                <div class="details ID">
                    <button class="registerBtn" type="submit">
                        <span class="btnText">Register</span>
                    </button>
                </div> 
            </div>
        </form>
        <div class="form-link">
            <span>Already have an account? <a href='/login'>Login</a></span>
        </div>
        <br>
    </div>
</body>
</html>
