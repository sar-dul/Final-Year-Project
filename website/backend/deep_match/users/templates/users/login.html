<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Login </title>

        <!-- Load static files -->
        {% load static %}

        <!-- CSS -->
        <link rel="stylesheet" href="{% static 'css/login.css' %}">
                        
    </head>
    <body>
        <section class="container forms" style="background-image:url('{% static 'images/login-background.jpg' %}');">
            <div class="form login">
                <div class="form-content">
                    <header>Login</header>
                    <form action="" method="post">
                        {% csrf_token %}
                        <div class="field input-field">
                            <input type="text" placeholder="Username" name="username" class="input" required>
                        </div>
                        <div class="field input-field">
                            <input type="password" placeholder="Password" name="password" class="password" required>
                        </div>
                        <div class="form-link">
                            <a href="#" class="forgot-pass">Forgot password?</a>
                        </div>
                        <div class="field button-field">
                            <button type="submit">Login</button>
                        </div>
                    </form>
                    <div class="form-link">
                        <span>Don't have an account? <a href="/register" class="link signup-link">Signup</a></span>
                    </div>
                </div>
                <br>
                {% if messages %}
                    {% for message in messages %}
                        {% if message.tags == 'error' %}
                            <p style="color: red;">{{ message }}</p>
                        {% endif %}
                    {% endfor %}
                {% endif %}
            </div>    
        </section>
    </body>
</html>
